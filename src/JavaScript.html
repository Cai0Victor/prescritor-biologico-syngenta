<script>
  let baseProdutos = [];
  let produtoSelecionado = null;

  // 1. INICIALIZAÇÃO E SUPORTE OFFLINE
  window.addEventListener('DOMContentLoaded', () => {
    inicializarAplicativo();
  });

  function inicializarAplicativo() {
    // Busca dados salvos na memória local do celular (Cache Offline)
    const dadosSalvos = localStorage.getItem('syngenta_catalogo_cache');
    
    if (dadosSalvos) {
      try {
        baseProdutos = JSON.parse(dadosSalvos);
        popularCulturas();
        exibirConteudoPrincipal();
      } catch (e) {
        console.error("Erro ao ler o cache local:", e);
      }
    }

    // Se houver internet, busca os dados mais recentes do Google Sheets e atualiza o cache
    if (navigator.onLine) {
      google.script.run
        .withSuccessHandler(dados => {
          if (dados && dados.length > 0) {
            baseProdutos = dados;
            // Atualiza a memória interna do dispositivo
            localStorage.setItem('syngenta_catalogo_cache', JSON.stringify(dados));
            popularCulturas();
          }
          exibirConteudoPrincipal();
        })
        .withFailureHandler(erro => {
          console.warn("Falha na conexão. Executando em modo offline.", erro);
          if (!dadosSalvos) {
            document.getElementById('loader').innerHTML = `
              <div class="text-red-600 font-semibold p-4">
                ❌ Erro ao carregar dados: ${erro.message}
              </div>
            `;
          }
        })
        .getDadosProdutos();
    } else if (!dadosSalvos) {
      document.getElementById('loader').innerHTML = `
        <div class="text-amber-600 font-semibold p-4">
          ⚠️ Dispositivo offline. Conecte-se à internet uma vez para realizar a primeira sincronização.
        </div>
      `;
    }
  }

  function exibirConteudoPrincipal() {
    const loader = document.getElementById('loader');
    const mainContent = document.getElementById('mainContent');
    if (loader) loader.classList.add('hidden');
    if (mainContent) mainContent.classList.remove('hidden');
  }

  function popularCulturas() {
    const select = document.getElementById('selectCultura');
    const valorAtual = select.value;
    const culturas = [...new Set(baseProdutos.map(p => p.cultura))].sort();
    
    select.innerHTML = '<option value="">Selecione a cultura...</option>';
    culturas.forEach(c => select.innerHTML += `<option value="${c}">${c}</option>`);
    
    if (valorAtual) select.value = valorAtual;
  }

  function aoMudarCultura() {
    const cultura = document.getElementById('selectCultura').value;
    const selectAlvo = document.getElementById('selectAlvo');

    resetarSelecaoProduto();

    if (!cultura) {
      selectAlvo.disabled = true;
      selectAlvo.innerHTML = '<option value="">Selecione a cultura primeiro...</option>';
      return;
    }

    const alvos = [...new Set(baseProdutos.filter(p => p.cultura === cultura).map(p => p.alvo))].sort();
    selectAlvo.innerHTML = '<option value="">Selecione o alvo...</option>';
    alvos.forEach(a => selectAlvo.innerHTML += `<option value="${a}">${a}</option>`);
    selectAlvo.disabled = false;
  }

  function aoMudarAlvo() {
    const cultura = document.getElementById('selectCultura').value;
    const alvo = document.getElementById('selectAlvo').value;
    const selectProduto = document.getElementById('selectProduto');

    resetarSelecaoProduto();

    if (!alvo) {
      selectProduto.disabled = true;
      selectProduto.innerHTML = '<option value="">Selecione o alvo primeiro...</option>';
      return;
    }

    const produtos = baseProdutos.filter(p => p.cultura === cultura && p.alvo === alvo);
    selectProduto.innerHTML = '<option value="">Selecione o produto...</option>';
    produtos.forEach(p => selectProduto.innerHTML += `<option value="${p.id}">${p.produto}</option>`);
    selectProduto.disabled = false;
  }

  function isAplicacaoViaSolo(tipoApp) {
    if (!tipoApp) return false;
    return tipoApp.toLowerCase().includes('solo');
  }

  function aoMudarProduto() {
    const idProduto = document.getElementById('selectProduto').value;
    if (!idProduto) {
      resetarSelecaoProduto();
      return;
    }

    produtoSelecionado = baseProdutos.find(p => String(p.id) === String(idProduto));

    if (produtoSelecionado) {
      document.getElementById('lblTipoAplicacao').innerText = produtoSelecionado.tipoAplicacao || '-';
      document.getElementById('lblDoseHa').innerText = `${produtoSelecionado.doseHa} ${produtoSelecionado.unidadeDose}`;
      document.getElementById('lblVolCaldaHa').innerText = `${produtoSelecionado.volCalda} ${produtoSelecionado.unidadeCalda}`;
      document.getElementById('lblObservacoes').innerText = produtoSelecionado.observacoes || 'Nenhuma';

      const containerSolo = document.getElementById('containerViaSolo');
      if (isAplicacaoViaSolo(produtoSelecionado.tipoAplicacao)) {
        containerSolo.classList.remove('hidden');
      } else {
        containerSolo.classList.add('hidden');
      }

      document.getElementById('cardDetalhes').classList.remove('hidden');
      document.getElementById('cardResultados').classList.remove('hidden');
      document.getElementById('cardAcoes').classList.remove('hidden');

      calcularDosagem();
    }
  }

  function resetarSelecaoProduto() {
    produtoSelecionado = null;
    document.getElementById('containerViaSolo').classList.add('hidden');
    document.getElementById('cardInfoViaSolo').classList.add('hidden');
    document.getElementById('cardDetalhes').classList.add('hidden');
    document.getElementById('cardResultados').classList.add('hidden');
    document.getElementById('cardAcoes').classList.add('hidden');
  }

  function extrairUnidadeBase(unidade) {
    if (!unidade) return '';
    return unidade.split('/')[0].trim();
  }

  function processarDose(doseCalculada, unidadeBase) {
    let valor = doseCalculada;
    let unidade = unidadeBase;

    if (unidade.toUpperCase() === 'L' && valor > 0 && valor < 1) {
      valor = valor * 1000;
      unidade = 'mL';
    } else if (unidade.toUpperCase() === 'KG' && valor > 0 && valor < 1) {
      valor = valor * 1000;
      unidade = 'g';
    }

    return {
      valorFormatted: valor.toLocaleString('pt-BR', { maximumFractionDigits: 2 }),
      unidade: unidade
    };
  }

  function obterCalculosGerais() {
    const area = parseFloat(document.getElementById('areaHa').value) || 0;
    const capTanque = parseFloat(document.getElementById('capacidadeTanque').value) || 0;
    const unProdBase = extrairUnidadeBase(produtoSelecionado.unidadeDose);
    const unCaldaBase = extrairUnidadeBase(produtoSelecionado.unidadeCalda);

    let volCaldaHaEfetivo = produtoSelecionado.volCalda;

    // Métricas Via Solo
    let esguichoMl = parseFloat(document.getElementById('volumeEsguicho').value) || 0;
    let espacamentoL = parseFloat(document.getElementById('espacamentoLinhas').value) || 0;
    let espacamentoP = parseFloat(document.getElementById('espacamentoPlantas').value) || 0;

    let plantasPorHa = 0;
    let plantasAreaTotal = 0;
    let dosePorPlantaBruta = 0;
    let infoDosePlanta = { valorFormatted: '0', unidade: 'mL/planta' };

    const ehViaSolo = isAplicacaoViaSolo(produtoSelecionado.tipoAplicacao);

    if (ehViaSolo && espacamentoL > 0 && espacamentoP > 0) {
      // 1. Quantas plantas por ha: 10000 / (espaçamento plantas * espaçamento linhas)
      plantasPorHa = 10000 / (espacamentoL * espacamentoP);
      
      // 2. Quantas plantas na area total
      plantasAreaTotal = plantasPorHa * area;

      // 3. Dose por planta: dose do produto/ha / quantidade de planta no Ha
      dosePorPlantaBruta = produtoSelecionado.doseHa / plantasPorHa;

      if (unProdBase.toUpperCase() === 'L') {
        infoDosePlanta = {
          valorFormatted: (dosePorPlantaBruta * 1000).toLocaleString('pt-BR', { maximumFractionDigits: 3 }),
          unidade: 'mL/planta'
        };
      } else if (unProdBase.toUpperCase() === 'KG') {
        infoDosePlanta = {
          valorFormatted: (dosePorPlantaBruta * 1000).toLocaleString('pt-BR', { maximumFractionDigits: 3 }),
          unidade: 'g/planta'
        };
      } else {
        infoDosePlanta = {
          valorFormatted: dosePorPlantaBruta.toLocaleString('pt-BR', { maximumFractionDigits: 3 }),
          unidade: `${unProdBase}/planta`
        };
      }

      // Se esguicho (mL/planta) for definido, recalcula o volume de calda/ha
      if (esguichoMl > 0) {
        volCaldaHaEfetivo = (plantasPorHa * esguichoMl) / 1000;
      }
    }

    const totalProduto = (produtoSelecionado.doseHa * area);
    const totalCalda = (volCaldaHaEfetivo * area);

    const cargasCheias = Math.floor(totalCalda / capTanque);
    const caldaParcial = totalCalda % capTanque;

    // 4. Dose por tanque / bomba
    const dosePorTanqueCheioBruta = (produtoSelecionado.doseHa / volCaldaHaEfetivo) * capTanque;
    const infoDoseCheia = processarDose(dosePorTanqueCheioBruta, unProdBase);

    let volProdCheioLitros = unProdBase.toUpperCase() === 'L' ? dosePorTanqueCheioBruta : (unProdBase.toUpperCase() === 'ML' ? dosePorTanqueCheioBruta / 1000 : 0);
    const aguaTanqueCheio = Math.max(0, capTanque - volProdCheioLitros);

    // Dose Carga Parcial
    let doseParcialBruta = 0;
    let aguaParcial = 0;
    let infoDoseParcial = { valorFormatted: '0', unidade: unProdBase };

    if (caldaParcial > 0) {
      doseParcialBruta = (produtoSelecionado.doseHa / volCaldaHaEfetivo) * caldaParcial;
      infoDoseParcial = processarDose(doseParcialBruta, unProdBase);

      let volProdParcialLitros = unProdBase.toUpperCase() === 'L' ? doseParcialBruta : (unProdBase.toUpperCase() === 'ML' ? doseParcialBruta / 1000 : 0);
      aguaParcial = Math.max(0, caldaParcial - volProdParcialLitros);
    }

    return {
      area, capTanque, totalProduto, totalCalda, unProdBase, unCaldaBase, volCaldaHaEfetivo,
      cargasCheias, caldaParcial, infoDoseCheia, aguaTanqueCheio,
      doseParcialBruta, infoDoseParcial, aguaParcial,
      esguichoMl, espacamentoL, espacamentoP,
      plantasPorHa, plantasAreaTotal, infoDosePlanta, dosePorTanqueCheioBruta
    };
  }

  function calcularDosagem() {
    if (!produtoSelecionado) return;

    const c = obterCalculosGerais();

    document.getElementById('lblAreaResumo').innerText = `${c.area.toLocaleString('pt-BR')} ha`;
    document.getElementById('lblTanqueCheioResumo').innerText = `Tanque/Bomba: ${c.capTanque.toLocaleString('pt-BR')} L`;

    document.getElementById('resTotalProduto').innerText = `${c.totalProduto.toLocaleString('pt-BR', { maximumFractionDigits: 2 })} ${c.unProdBase}`;
    document.getElementById('resTotalCalda').innerText = `${c.totalCalda.toLocaleString('pt-BR', { maximumFractionDigits: 2 })} ${c.unCaldaBase}`;

    // Exibição do Card Via Solo
    const cardViaSolo = document.getElementById('cardInfoViaSolo');
    if (isAplicacaoViaSolo(produtoSelecionado.tipoAplicacao)) {
      cardViaSolo.classList.remove('hidden');
      document.getElementById('lblArranjoResumo').innerText = `Arranjo: ${c.espacamentoL}m x ${c.espacamentoP}m (${c.esguichoMl} mL/planta)`;
      document.getElementById('resDosePorPlanta').innerText = `${c.infoDosePlanta.valorFormatted} ${c.infoDosePlanta.unidade}`;
      document.getElementById('resDosePorTanqueBomba').innerText = `${c.infoDoseCheia.valorFormatted} ${c.infoDoseCheia.unidade}`;
      document.getElementById('resPlantasPorHa').innerText = `${c.plantasPorHa.toLocaleString('pt-BR', { maximumFractionDigits: 0 })} plantas/ha`;
      document.getElementById('resPlantasAreaTotal').innerText = `${c.plantasAreaTotal.toLocaleString('pt-BR', { maximumFractionDigits: 0 })} plantas`;
    } else {
      cardViaSolo.classList.add('hidden');
    }

    const cardCheia = document.getElementById('cardCargaCheia');
    const cardParcial = document.getElementById('cardCargaParcial');

    // Cargas Cheias
    if (c.cargasCheias > 0) {
      cardCheia.classList.remove('hidden');
      document.getElementById('lblQtdCargasCheias').innerText = c.cargasCheias;
      document.getElementById('resDosePorTanqueCheio').innerText = `${c.infoDoseCheia.valorFormatted} ${c.infoDoseCheia.unidade}`;
      document.getElementById('resAguaPorTanqueCheio').innerText = `${c.aguaTanqueCheio.toLocaleString('pt-BR', { maximumFractionDigits: 2 })} L`;
    } else {
      cardCheia.classList.add('hidden');
    }

    // Carga Parcial
    if (c.caldaParcial > 0) {
      cardParcial.classList.remove('hidden');
      const titulo = c.cargasCheias === 0 ? "⚠️ Receita da Carga Única (Parcial)" : "⚠️ Receita da Última Carga Parcial";
      document.getElementById('lblTituloCargaParcial').innerText = titulo;
      document.getElementById('lblVolCaldaParcial').innerText = `Calda: ${c.caldaParcial.toLocaleString('pt-BR', { maximumFractionDigits: 2 })} L`;
      document.getElementById('resDoseParcial').innerText = `${c.infoDoseParcial.valorFormatted} ${c.infoDoseParcial.unidade}`;
      document.getElementById('resAguaParcial').innerText = `${c.aguaParcial.toLocaleString('pt-BR', { maximumFractionDigits: 2 })} L`;
    } else {
      cardParcial.classList.add('hidden');
    }

    // Resumo de Cargas
    if (c.cargasCheias === 0) {
      document.getElementById('resResumoCargas').innerText = `1 carga parcial (${c.caldaParcial.toLocaleString('pt-BR')} L)`;
    } else if (c.caldaParcial > 0) {
      document.getElementById('resResumoCargas').innerText = `${c.cargasCheias} cheia(s) + 1 parcial`;
    } else {
      document.getElementById('resResumoCargas').innerText = `${c.cargasCheias} cheia(s)`;
    }
  }

  function compartilharWhatsApp() {
    if (!produtoSelecionado) return;

    const c = obterCalculosGerais();
    const ehViaSolo = isAplicacaoViaSolo(produtoSelecionado.tipoAplicacao);

    let msg = `*PRESCRICAO TECNICA - SYNGENTA BIOLOGICALS* 🌱\n\n`;
    msg += `🌾 *Cultura:* ${produtoSelecionado.cultura}\n`;
    msg += `🎯 *Alvo:* ${produtoSelecionado.alvo}\n`;
    msg += `🧪 *Produto:* ${produtoSelecionado.produto}\n`;
    msg += `🚜 *Modalidade:* ${produtoSelecionado.tipoAplicacao}\n`;
    msg += `📐 *Área Total:* ${c.area.toLocaleString('pt-BR')} ha\n\n`;
    
    msg += `*DOSAGEM E PARAMETROS BASE:* \n`;
    msg += `• Dose/ha: ${produtoSelecionado.doseHa} ${produtoSelecionado.unidadeDose}\n`;
    msg += `• Vol. Calda/ha: ${c.volCaldaHaEfetivo.toLocaleString('pt-BR', { maximumFractionDigits: 1 })} L/ha\n`;

    if (ehViaSolo) {
      msg += `\n🪴 *PARAMETROS DE APLICAÇÃO VIA SOLO / ESGUICHO:* \n`;
      msg += `• Esguicho: ${c.esguichoMl} mL/planta\n`;
      msg += `• Espaçamento: ${c.espacamentoL} m (linhas) x ${c.espacamentoP} m (plantas)\n`;
      msg += `• Quantidade de Plantas/ha: ${c.plantasPorHa.toLocaleString('pt-BR', { maximumFractionDigits: 0 })} plantas\n`;
      msg += `• Quantidade de Plantas na Área: ${c.plantasAreaTotal.toLocaleString('pt-BR', { maximumFractionDigits: 0 })} plantas\n`;
      msg += `• Dose por Planta: ${c.infoDosePlanta.valorFormatted} ${c.infoDosePlanta.unidade}\n`;
      msg += `• Dose por Tanque / Bomba: ${c.infoDoseCheia.valorFormatted} ${c.infoDoseCheia.unidade}\n`;
    }

    msg += `\n🚜 *PREPARO DA CALDA (TANQUE / BOMBA: ${c.capTanque.toLocaleString('pt-BR')} L):* \n`;
    
    if (c.cargasCheias > 0) {
      msg += `• *Tanque/Bomba Cheia (${c.cargasCheias}x):* ${c.infoDoseCheia.valorFormatted} ${c.infoDoseCheia.unidade} de produto + ${c.aguaTanqueCheio.toLocaleString('pt-BR', { maximumFractionDigits: 2 })} L de água\n`;
    }

    if (c.caldaParcial > 0) {
      const rotuloParcial = c.cargasCheias === 0 ? "Carga Única Parcial" : "Última Carga Parcial";
      msg += `• *${rotuloParcial} (${c.caldaParcial.toLocaleString('pt-BR', { maximumFractionDigits: 2 })} L de calda):* ${c.infoDoseParcial.valorFormatted} ${c.infoDoseParcial.unidade} de produto + ${c.aguaParcial.toLocaleString('pt-BR', { maximumFractionDigits: 2 })} L de água\n`;
    }

    msg += `\n📊 *NECESSIDADE TOTAL PARA A ÁREA:* \n`;
    msg += `• *Produto Total:* ${c.totalProduto.toLocaleString('pt-BR', { maximumFractionDigits: 2 })} ${c.unProdBase}\n`;
    msg += `• *Calda Total:* ${c.totalCalda.toLocaleString('pt-BR', { maximumFractionDigits: 2 })} ${c.unCaldaBase}\n\n`;

    if (produtoSelecionado.observacoes) {
      msg += `📋 *Obs. Técnicas:* ${produtoSelecionado.observacoes}\n\n`;
    }

    msg += `_CT BIO Syngenta - Thais dos Santos Gomes - Nater Coop_`;

    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
  }

  function gerarPDF() {
    window.print();
  }
</script>
