<style>
  :root {
    --syngenta-green: #008751;
    --syngenta-dark: #006b40;
  }

  .bg-syngenta { background-color: var(--syngenta-green); }
  .bg-syngenta-dark { background-color: var(--syngenta-dark); }
  .text-syngenta { color: var(--syngenta-green); }

  .fade-in {
    animation: fadeIn 0.3s ease-in-out forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .loader {
    border: 3px solid #e2e8f0;
    border-top: 3px solid var(--syngenta-green);
    border-radius: 50%;
    width: 18px;
    height: 18px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
